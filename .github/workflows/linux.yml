# Build the C++ port for x86_64 Linux (any distribution, the Steam Deck among
# them) with cpp/linux/build.sh, and keep the archive as the run's artifact.
# A tag v* also puts it on a GitHub release. The archive is named for the
# version: warlords2-v0.2-linux-x86_64.tar.gz for a tag, and for a commit
# after one, git describe's v0.2-3-gabc1234.

name: Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["cpp/src/**", "cpp/CMakeLists.txt", "cpp/test/**", "cpp/linux/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      # the whole history and its tags, for git describe
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SDL2's source and its build, kept until build.sh changes (it names
      # the version).
      - uses: actions/cache@v4
        with:
          path: |
            cpp/build/linux/SDL2-*.tar.gz
            cpp/build/linux/sdl
          key: sdl-${{ hashFiles('cpp/linux/build.sh') }}

      - run: sh cpp/linux/build.sh

      - name: Name the archive for its version
        id: name
        run: |
          name="warlords2-$(git describe --tags --always)-linux-x86_64"
          mv cpp/build/linux/warlords2-linux-x86_64.tar.gz "cpp/build/linux/$name.tar.gz"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The archive as a user unpacks it, started with no screen or sound:
      # the start screens, then a scenario.
      - name: Smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p "$RUNNER_TEMP/try"
          tar -xzf "cpp/build/linux/${{ steps.name.outputs.name }}.tar.gz" -C "$RUNNER_TEMP/try"
          printf 'wait 60\nquit\n' > "$RUNNER_TEMP/start.txt"
          printf 'wait 120\nkey return\nwait 60\nquit\n' > "$RUNNER_TEMP/game.txt"
          "$RUNNER_TEMP/try/Warlords2/warlords2.sh" --window --script "$RUNNER_TEMP/start.txt"
          "$RUNNER_TEMP/try/Warlords2/warlords2.sh" --window --scenario ERYTHEA --seed 1 --script "$RUNNER_TEMP/game.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: cpp/build/linux/${{ steps.name.outputs.name }}.tar.gz
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
      - run: gh release create "$GITHUB_REF_NAME" "$NAME.tar.gz" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
