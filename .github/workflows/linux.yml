# Build the C++ port for x86_64 Linux (any distribution, the Steam Deck among
# them) with cpp/linux/build.sh, and keep the archive as the run's artifact.
# A tag v* also puts it on a GitHub release.

name: Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["cpp/src/**", "cpp/CMakeLists.txt", "cpp/test/**", "cpp/linux/**", ".github/workflows/linux.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDL2's source and its build, kept until build.sh changes (it names
      # the version).
      - uses: actions/cache@v4
        with:
          path: |
            cpp/build/linux/SDL2-*.tar.gz
            cpp/build/linux/sdl
          key: sdl-${{ hashFiles('cpp/linux/build.sh') }}

      - run: sh cpp/linux/build.sh

      # The archive as a user unpacks it, started with no screen or sound:
      # the start screens, then a scenario.
      - name: Smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p "$RUNNER_TEMP/try"
          tar -xzf cpp/build/linux/warlords2-linux-x86_64.tar.gz -C "$RUNNER_TEMP/try"
          printf 'wait 60\nquit\n' > "$RUNNER_TEMP/start.txt"
          printf 'wait 120\nkey return\nwait 60\nquit\n' > "$RUNNER_TEMP/game.txt"
          "$RUNNER_TEMP/try/Warlords2/warlords2.sh" --window --script "$RUNNER_TEMP/start.txt"
          "$RUNNER_TEMP/try/Warlords2/warlords2.sh" --window --scenario ERYTHEA --seed 1 --script "$RUNNER_TEMP/game.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: warlords2-linux-x86_64
          path: cpp/build/linux/warlords2-linux-x86_64.tar.gz
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: warlords2-linux-x86_64
      - run: gh release create "$GITHUB_REF_NAME" warlords2-linux-x86_64.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
